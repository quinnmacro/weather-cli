[project]
name = "weather-cli"
version = "0.1.0"
description = "A simple command-line weather application"
authors = [
    {name = "Test User", email = "test@example.com"}
]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.0.0",
    "click>=8.1.0"
]

[project.scripts]
weather = "weather_cli.main:main"
weather-advanced = "weather_cli.advanced:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "B", "W", "C", "N"]
ignore = ["E501", "N802", "N803", "N806"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true