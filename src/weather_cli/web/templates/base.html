<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TrailWeather{% endblock %}</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>

    <style>
        :root {
            --primary: #2d5a27;
            --primary-dark: #1e3d1a;
            --accent: #e85d04;
            --accent-light: #f48c06;
            --bg-dark: #1a1a1a;
            --bg-card: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.5;
        }

        /* Navigation */
        .nav {
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-inner {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links {
            display: flex;
            gap: 32px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-primary);
        }

        /* Main Layout */
        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .card-body {
            padding: 20px;
        }

        /* Weather Hero */
        .weather-hero {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .current-weather {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .weather-icon-large {
            font-size: 5rem;
            line-height: 1;
        }

        .temp-large {
            font-size: 4rem;
            font-weight: 300;
        }

        .temp-unit {
            font-size: 1.5rem;
            color: var(--text-secondary);
        }

        .weather-meta {
            display: flex;
            gap: 24px;
            margin-top: 12px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Map Container */
        .map-container {
            height: 500px;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Data Grid */
        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .data-item {
            background: rgba(255,255,255,0.03);
            padding: 16px;
            border-radius: 8px;
        }

        .data-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .data-value {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .data-unit {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Forecast Cards */
        .forecast-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .forecast-day {
            flex: 0 0 100px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .forecast-day.today {
            background: var(--primary);
        }

        .forecast-name {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .forecast-icon {
            font-size: 1.5rem;
            margin: 8px 0;
        }

        .forecast-temps {
            font-size: 0.85rem;
        }

        .temp-high {
            font-weight: 600;
        }

        .temp-low {
            color: var(--text-secondary);
        }

        /* Activity Score */
        .score-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(var(--success) var(--score-percent), rgba(255,255,255,0.1) 0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .score-inner {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .score-value {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .score-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-accent {
            background: var(--accent);
            color: white;
        }

        .btn-accent:hover {
            background: var(--accent-light);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.05);
        }

        /* Upload Zone */
        .upload-zone {
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: rgba(45, 90, 39, 0.1);
        }

        .upload-zone.dragover {
            border-color: var(--accent);
            background: rgba(232, 93, 4, 0.1);
        }

        /* Charts */
        .chart-container {
            height: 200px;
            position: relative;
        }

        /* Timeline */
        .timeline {
            display: flex;
            overflow-x: auto;
            gap: 2px;
            padding: 8px 0;
        }

        .timeline-hour {
            flex: 0 0 50px;
            text-align: center;
            padding: 8px 4px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .timeline-hour.good {
            background: rgba(74, 222, 128, 0.2);
        }

        .timeline-hour.moderate {
            background: rgba(251, 191, 36, 0.2);
        }

        .timeline-hour.poor {
            background: rgba(248, 113, 113, 0.2);
        }

        /* Alert Banner */
        .alert-banner {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .alert-banner.success {
            background: linear-gradient(135deg, var(--primary), #3a7a32);
        }

        /* Grid Layouts */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .weather-hero {
                grid-template-columns: 1fr;
            }
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Waypoint Table */
        .waypoint-table {
            width: 100%;
            border-collapse: collapse;
        }

        .waypoint-table th {
            text-align: left;
            padding: 12px;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .waypoint-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }

        .waypoint-table tr:hover {
            background: rgba(255,255,255,0.02);
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success { background: rgba(74, 222, 128, 0.2); color: #4ade80; }
        .badge-warning { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
        .badge-danger { background: rgba(248, 113, 113, 0.2); color: #f87171; }
        .badge-info { background: rgba(96, 165, 250, 0.2); color: #60a5fa; }
    </style>

    {% block head %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="logo">
                🏔️ TrailWeather
            </a>
            <div class="nav-links">
                <a href="/" class="{% block nav_home %}{% endblock %}">Dashboard</a>
                <a href="/planner" class="{% block nav_planner %}{% endblock %}">Route Planner</a>
                <a href="/compare" class="{% block nav_compare %}{% endblock %}">Compare Routes</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
